<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮克敏高階戰力計算站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="picture/logo.png" alt="網站 Logo" class="logo">
            <h1>皮克敏高階戰力精算站</h1>
        </div>
        <nav>
            <a href="#calculator">戰力計算</a>
            <a href="#report">最新回報</a>
        </nav>
    </header>

    <main>
        <section id="calculator" class="section-box">
            <h2>🧮 高階戰力模擬器</h2>
            <div class="calc-flex">
                <div class="form-group">
                    <label>1. 選擇皮克敏顏色：</label>
                    <div class="pikmin-select">
                        <label><input type="radio" name="color" value="red" checked><img src="picture/pikmin_red.png" alt="紅">紅 (4)</label>
                        <label><input type="radio" name="color" value="blue"><img src="picture/pikmin_blue.png" alt="藍">藍 (3)</label>
                        <label><input type="radio" name="color" value="yellow"><img src="picture/pikmin_yellow.png" alt="黃">黃 (3)</label>
                        <label><input type="radio" name="color" value="purple"><img src="picture/pikmin_purple.png" alt="紫">紫 (6)</label>
                        <label><input type="radio" name="color" value="white"><img src="picture/pikmin_white.png" alt="白">白 (2)</label>
                        <label><input type="radio" name="color" value="rock"><img src="picture/pikmin_rock.png" alt="岩">岩 (5)</label>
                        <label><input type="radio" name="color" value="wing"><img src="picture/pikmin_wing.png" alt="羽">羽 (2)</label>
                    </div>
                    <br>

                    <label for="hearts">2. 好感度等級 (愛心)：</label>
                    <select id="hearts">
                        <option value="0">0 心 (+0)</option>
                        <option value="1">紅心 1 (+1)</option>
                        <option value="2">紅心 2 (+2)</option>
                        <option value="3">紅心 3 (+3)</option>
                        <option value="4">紅心 4 (+4)</option>
                        <option value="8">金心 1 (+8)</option>
                        <option value="12">金心 2 (+12)</option>
                        <option value="16">金心 3 (+16)</option>
                        <option value="20">金心 4 (+20)</option>
                    </select>
                    <br><br>

                    <label for="flower">3. 頭部花朵狀態：</label>
                    <select id="flower">
                        <option value="0">葉子 (+0)</option>
                        <option value="2">花苞 (+2)</option>
                        <option value="3">一般花朵 (+3)</option>
                        <option value="4">當季特殊花卉 (+4)</option>
                        <option value="5">本月精選特殊花卉 (+5)</option>
                    </select>
                    <br><br>

                    <label for="decor">4. 飾品類型與當季活動加成：</label>
                    <select id="decor">
                        <option value="0">無飾品 (+0)</option>
                        <option value="4">一般常駐飾品 (+4)</option>
                        <option value="100">當季副活動飾品 (+100)</option>
                        <option value="300">當季主活動飾品 (+300)</option>
                    </select>
                    <br><br>

                    <label for="mushroom-type">5. 選擇對抗的蘑菇種類：</label>
                    <select id="mushroom-type">
                        <option value="none">不指定（無匹配加成）</option>
                        <optgroup label="—— 普通蘑菇 (匹配 +12) ——">
                            <option value="red">紅色蘑菇（紅皮克敏）</option>
                            <option value="blue">藍色蘑菇（藍皮克敏）</option>
                            <option value="blue_ice">冰藍蘑菇（藍皮克敏）</option>
                            <option value="yellow">黃色蘑菇（黃皮克敏）</option>
                            <option value="purple">紫色蘑菇（紫皮克敏）</option>
                            <option value="white">白色蘑菇（白皮克敏）</option>
                            <option value="rock">灰色蘑菇（岩皮克敏）</option>
                            <option value="wing">粉紅色蘑菇（羽皮克敏）</option>
                        </optgroup>
                        <optgroup label="—— 特殊/元素蘑菇 (不符則禁止參戰) ——">
                            <option value="rock_crystal">水晶蘑菇（限岩皮克敏）</option>
                            <option value="red_fire">火蘑菇（限紅皮克敏）</option>
                            <option value="blue_water">水蘑菇（限藍皮克敏）</option>
                            <option value="white_poison">毒蘑菇（限白皮克敏）</option>
                            <option value="yellow_electric">電子蘑菇（限黃皮克敏）</option>
                        </optgroup>
                        <optgroup label="—— 本月特殊活動蘑菇 (任何顏色皆可/匹配 +300) ——">
                            <option value="event_special">本月限定活動蘑菇（特殊裝飾全匹配）</option>
                        </optgroup>
                    </select>
                </div>

                <div class="result-box" id="result-box-container">
                    <h3>預估單體總破壞力</h3>
                    <p id="total-score" class="score">0</p>
                </div>
            </div>
        </section>

        <section id="report-form-section" class="section-box">
            <h2>✍️ 新增蘑菇回報</h2>
            <form id="mushroom-form" class="report-form">
                <div class="form-row">
                    <div class="form-cell">
                        <label for="form-city">選擇縣市：</label>
                        <select id="form-city" required>
                            <option value="高雄市" selected>高雄市</option>
                            <option value="臺南市">臺南市</option>
                            <option value="嘉義市">嘉義市</option>
                            <option value="嘉義縣">嘉義縣</option>
                            <option value="屏東縣">屏東縣</option>
                        </select>
                    </div>
                    <div class="form-cell">
                        <label for="form-district">選擇行政區：</label>
                        <select id="form-district" required>
                            </select>
                    </div>
                    <div class="form-cell" style="flex: 2;">
                        <label for="form-name">具體地點名稱：</label>
                        <input type="text" id="form-name" placeholder="例如：時代大道、英德街 81 號" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-cell">
                        <label for="form-type">蘑菇種類：</label>
                        <select id="form-type" required>
                            <option value="red">紅色蘑菇</option>
                            <option value="purple">紫色蘑菇</option>
                            <option value="ice">冰藍蘑菇</option>
                            <option value="crystal">水晶蘑菇</option>
                            <option value="fire">火蘑菇</option>
                            <option value="water">水蘑菇</option>
                            <option value="poison">毒蘑菇</option>
                            <option value="electric">電子蘑菇</option>
                            <option value="event">本月限定活動蘑菇</option>
                        </select>
                    </div>
                    <div class="form-cell" style="flex: 0 0 130px; min-width: 110px;">
                        <label for="form-size">蘑菇大小：</label>
                        <select id="form-size" required>
                            <option value="小">小</option>
                            <option value="普通" selected>普通</option>
                            <option value="大">大</option>
                            <option value="巨型">巨型</option>
                        </select>
                    </div>
                    <div class="form-cell">
                        <label>當前畫面剩餘時間：</label>
                        <div class="time-input-group">
                            <input type="number" id="form-hours" min="0" max="23" placeholder="時" required><span>時</span>
                            <input type="number" id="form-minutes" min="0" max="59" placeholder="分" required><span>分</span>
                            <input type="number" id="form-seconds" min="0" max="59" placeholder="秒" value="0" required><span>秒</span>
                        </div>
                    </div>
                    <div class="form-cell" style="flex: 0 0 160px; min-width: 140px;">
                        <label for="form-count">目前人數 (自填)：</label>
                        <input type="number" id="form-count" min="0" max="5" value="0" placeholder="0-5" required>
                        <small id="count-hint" style="color: #666; font-size: 11px; display: block; margin-top: 2px;">上限: 5人</small>
                    </div>
                </div>
                <button type="submit" class="submit-btn">🚀 送出回報資料</button>
            </form>
        </section>

        <section id="report" class="section-box">
            <h2>🍄 當前最新蘑菇回報</h2>
            <div class="location-select-wrapper">
                <label>📍 篩選顯示區域：</label>
                <select id="filter-city">
                    <option value="all">顯示所有縣市</option>
                    <option value="高雄市">高雄市</option>
                    <option value="臺南市">臺南市</option>
                    <option value="嘉義市">嘉義市</option>
                    <option value="嘉義縣">嘉義縣</option>
                    <option value="屏東縣">屏東縣</option>
                </select>
                <select id="filter-district">
                    <option value="all">顯示所有行政區</option>
                </select>
                <button id="geo-btn" class="geo-btn">🎯 自動定位</button>
            </div>

            <div class="grid-container" id="mushroom-container">
                <div class="card" data-city="高雄市" data-district="前鎮">
                    <button class="pin-btn" title="釘選此位置">📌</button>
                    <button class="delete-btn" title="刪除此蘑菇">❌ 刪除</button>
                    <img src="picture/mushroom_ice.png" alt="冰藍蘑菇" class="card-icon">
                    <h3>[大] 普通冰藍蘑菇</h3>
                    <p>📍 地點：高雄市前鎮區英德街 81 號</p>
                    <p class="countdown" 
                       data-report-time="2026-06-27 12:15:00" 
                       data-initial-hours="0" 
                       data-initial-minutes="20"
                       data-initial-seconds="45">⏳ 剩餘時間：計算中...</p>
                    <p>👥 目前人數：<span class="p-count">2</span> / 20 人</p>
                </div>
            </div>
        </section>
    </main>

    <div class="dev-toolbar">
        <button id="dev-mode-btn" class="dev-mode-btn">🛠️ 開啟開發者模式</button>
        <span id="dev-status" class="dev-status">🔒 安全瀏覽模式</span>
    </div>

    <footer>
        <p>&copy; 2026 皮克敏蘑菇社群網站. 非官方粉絲製作.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
