<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮克敏蘑菇即時回報站</title>
    <link rel="stylesheet" href="style.css">
    
    
</head>
<body>

    <div class="filter-section" style="background: #f1f8e9; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 1200px; text-align: center;">
        
        <div class="filter-group" style="display: inline-block; margin: 5px;">
            <label for="filter-city">📍 選擇縣市：</label>
            <select id="filter-city"></select>
        </div>

        <div class="filter-group" style="display: inline-block; margin: 5px;">
            <label for="filter-district">選擇行政區：</label>
            <select id="filter-district"></select>
        </div>

        <div class="filter-group" style="display: inline-block; margin: 5px;">
            <label for="card-sort">📊 排序方式：</label>
            <select id="card-sort">
                <option value="remainingTime">剩餘時間 (最少)</option>
                <option value="updateTime">更新時間 (最新)</option>
                <option value="totalPlayers">參戰人數 (最多)</option>
                <option value="mushroomSize">蘑菇大小 (最大)</option>
                <option value="mushroomType">蘑菇種類 (名稱)</option>
            </select>
        </div>

        <div class="filter-group" style="display: inline-block; margin: 5px;">
            <input type="text" id="search-name" placeholder="🔍 搜尋關鍵字 (如：電桶)..." 
                   style="padding: 7px 12px; border: 1px solid #ccc; border-radius: 20px; font-size: 14px; width: 190px; outline: none; transition: border 0.2s;">
        </div>

        <div class="filter-group" style="display: inline-block; margin: 5px;">
            <button id="view-toggle-btn" style="padding: 7px 14px; background: #fff; border: 1px solid #ccc; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s;">
                🎴 卡片模式
            </button>
        </div>

        <button id="geo-btn" style="padding: 7px 14px; background: #2e7d32; color: #fff; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; margin: 5px;">🎯 自動定位</button>
    </div>


    <div id="mushroom-container">
        </div>


    <script src="report.js"></script>
</body>
</html>
