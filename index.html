<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮克敏高階工具站 | 戰力模擬器</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/simulator.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="picture/logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/40x40?text=Logo'">
                <h1>皮克敏工具站</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">戰力模擬器</a></li>
                <li><a href="report.html">蘑菇情報</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-container">
        <div class="card">
            <h2>🍄 單隻戰力預估模擬器</h2>
            <p class="description">請選擇您的皮克敏狀態與目標蘑菇，系統將為您即時計算預估破壞力。</p>

            <form id="simulator-form" class="simulator-form">
                <div class="form-group">
                    <label for="target-mushroom">目標蘑菇種類：</label>
                    <select id="target-mushroom" name="targetMushroom">
                        <option value="normal">一般蘑菇</option>
                        <option value="fire">火蘑菇</option>
                        <option value="water">水蘑菇</option>
                        <option value="crystal">水晶蘑菇</option>
                        <option value="poison">毒蘑菇</option>
                    </select>
                </div>

                <hr class="divider">

                <div class="form-group">
                    <label for="pikmin-color">皮克敏顏色：</label>
                    <select id="pikmin-color" name="pikminColor">
                        <option value="red">🔴 紅色皮克敏</option>
                        <option value="blue">🔵 藍色皮克敏</option>
                        <option value="yellow">🟡 黃色皮克敏</option>
                        <option value="purple">🟣 紫色皮克敏</option>
                        <option value="white">⚪ 白色皮克敏</option>
                        <option value="rock">🪨 岩石皮克敏</option>
                        <option value="winged">🪽 羽翅皮克敏</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="friendship-level">友好度等級 (0-8 愛心)：</label>
                    <input type="number" id="friendship-level" name="friendshipLevel" min="0" max="8" value="4">
                </div>

                <div class="form-group">
                    <label for="flower-status">頭頂花朵狀態：</label>
                    <select id="flower-status" name="flowerStatus">
                        <option value="bare">禿頭 (無)</option>
                        <option value="leaf">葉子</option>
                        <option value="bud">花苞</option>
                        <option value="normal_flower">一般花朵</option>
                        <option value="special_flower">特殊花朵</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="decor-status">飾品狀態：</label>
                    <select id="decor-status" name="decorStatus">
                        <option value="none">無飾品</option>
                        <option value="decor">有飾品</option>
                    </select>
                </div>
            </form>

            <div class="result-section">
                <h3>預估破壞力</h3>
                <div id="power-result" class="power-value">--</div>
                
                <div id="error-message" class="error-message" style="display: none;">
                    ❌ 禁止參戰：皮克敏屬性不符！
                </div>
            </div>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/simulator.js"></script>
</body>
</html>
