<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮克敏高階工具站 | 戰力即時模擬器</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/simulator.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="picture/logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/40x40?text=Logo'">
                <h1>皮克敏工具站</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">戰力模擬器</a></li>
                <li><a href="report.html">開源看板</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-container">
        <section class="card">
            <h2>📊 戰力即時模擬器</h2>
            <form id="simulator-form" class="simulator-form" onsubmit="return false;">
                
                <div class="form-group">
                    <label for="target-mushroom">目標蘑菇種類：</label>
                    <select id="target-mushroom">
    <option value="default">⚪ 無指定/普通通用</option>

    <option value="normal_red">🔴 一般紅蘑菇</option>
    <option value="normal_blue">🔵 一般藍蘑菇</option>
    <option value="normal_yellow">🟡 一般黃蘑菇</option>
    <option value="normal_purple">🟣 一般紫蘑菇</option>
    <option value="normal_white">⚪ 一般白蘑菇</option>
    <option value="normal_rock">🪨 一般岩石蘑菇</option>
    <option value="normal_winged">🧚 一般羽翅蘑菇</option>
    <option value="normal_ice">🥶 一般冰藍蘑菇</option>

    <option value="fire">🔥 火蘑菇</option>
    <option value="water">💧 水蘑菇</option>
    <option value="monthly_special">🌟 每月特殊蘑菇</option>
</select>
                </div>

                <div class="form-group">
                    <label for="pikmin-color">皮克敏顏色 / 種類：</label>
                    <select id="pikmin-color" name="pikminColor">
                        <option value="purple">🟣 紫色皮克敏 (基礎戰力: 6)</option>
                        <option value="rock">🪨 岩石皮克敏 (基礎戰力: 5)</option>
                        <option value="red" selected>🔴 紅色皮克敏 (基礎戰力: 4)</option>
                        <option value="yellow">🟡 黃色皮克敏 (基礎戰力: 3)</option>
                        <option value="blue">🔵 藍色皮克敏 (基礎戰力: 3)</option>
                        <option value="white">⚪ 白色皮克敏 (基礎戰力: 2)</option>
                        <option value="winged">🪽 羽翅皮克敏 (基礎戰力: 2)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="flower-status">頭頂花朵狀態：</label>
                    <select id="flower-status" name="flowerStatus">
                        <option value="bare">基礎戰力 / 禿頭 (+0)</option>
                        <option value="leaf">🌱 葉子頭 (+1)</option>
                        <option value="bud">🟢 花苞頭 (+2)</option>
                        <option value="normal_flower" selected>🌸 普花頭 (+3)</option>
                        <option value="special_flower">🌹 特殊花 / 當月副花 (+4)</option>
                        <option value="monthly_main_flower">🌻 當月主花 (+5)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="decor-status">飾品狀態：</label>
                    <select id="decor-status" name="decorStatus">
                        <option value="none">無飾品 (+0)</option>
                        <option value="normal_decor" selected>🎒 一般飾品 (+4)</option>
                        <option value="monthly_main_decor">🎒 本月主飾品 (+4，打當月菇外加 +300)</option>
                        <option value="monthly_sub_decor">🎖️ 本月副飾品 (+4，打當月菇外加 +100)</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="red-hearts">❤️ 紅色愛心數量 (0-4)：</label>
                        <input type="number" id="red-hearts" min="0" max="4" value="4" required>
                    </div>
                    <div class="form-group">
                        <label for="gold-hearts">💛 金色愛心數量 (0-4)：</label>
                        <input type="number" id="gold-hearts" min="0" max="4" value="0" required>
                    </div>
                </div>

            </form>

            <div class="result-section">
                <h3>模擬單隻計算結果</h3>
                <div id="power-result" class="power-value">0</div>
                <div id="error-message" class="error-message" style="display: none;">❌ 屬性不符，禁止參戰！</div>
            </div>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/simulator.js"></script>
</body>
</html>
