<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮克敏即時蘑菇回報系統</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="picture/logo.png" alt="網站 Logo" class="logo">
            <h1>皮克敏高階戰力精算站</h1>
        </div>
        <nav>
            <a href="index.html">戰力計算</a>
            <a href="report.html" class="active">最新回報系統</a>
        </nav>
    </header>

    <main>
        <section id="report-form-section" class="section-box">
            <h2>✍️ 新增蘑菇回報</h2>
            <form id="mushroom-form" class="report-form">
                <div class="form-row">
                    <div class="form-cell">
                        <label for="form-city">選擇縣市：</label>
                        <select id="form-city" required>
                            </select>
                    </div>
                    <div class="form-cell">
                        <label for="form-district">選擇行政區：</label>
                        <select id="form-district" required>
                            </select>
                    </div>
                    <div class="form-cell" style="flex: 2;">
                        <label for="form-name">具體地點名稱：</label>
                        <input type="text" id="form-name" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-cell">
                        <label for="form-type">蘑菇種類：</label>
                        <select id="form-type" required>
                            <optgroup label="—— 普通/冰藍蘑菇 ——">
                                <option value="red">紅色蘑菇</option>
                                <option value="blue">藍色蘑菇</option>
                                <option value="yellow">黃色蘑菇</option>
                                <option value="purple">紫色蘑菇</option>
                                <option value="white">白色蘑菇</option>
                                <option value="rock">灰色蘑菇</option>
                                <option value="wing">粉紅色蘑菇</option>
                                <option value="ice">冰藍蘑菇</option>
                            </optgroup>
                            <optgroup label="—— 特殊/元素蘑菇 ——">
                                <option value="rock_crystal">水晶蘑菇</option>
                                <option value="red_fire">火蘑菇</option>
                                <option value="blue_water">水蘑菇</option>
                                <option value="white_poison">毒蘑菇</option>
                                <option value="yellow_electric">電子蘑菇</option>
                            </optgroup>
                            <optgroup label="—— 限定活動 ——">
                                <option value="event_special">本月限定活動蘑菇</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-cell" style="flex: 0 0 130px; min-width: 110px;">
                        <label for="form-size">蘑菇大小：</label>
                        <select id="form-size" required>
                            <option value="小">小</option>
                            <option value="普通" selected>普通</option>
                            <option value="大">大</option>
                            <option value="巨型">巨型</option>
                        </select>
                    </div>
                    <div class="form-cell">
                        <label>當前畫面剩餘時間：</label>
                        <div class="time-input-group">
                            <input type="number" id="form-hours" min="0" max="23" placeholder="時" required><span>時</span>
                            <input type="number" id="form-minutes" min="0" max="59" placeholder="分" required><span>分</span>
                            <input type="number" id="form-seconds" min="0" max="59" placeholder="秒" value="0" required><span>秒</span>
                        </div>
                    </div>
                    <div class="form-cell" style="flex: 0 0 160px; min-width: 140px;">
                        <label for="form-count">目前人數 (自填)：</label>
                        <input type="number" id="form-count" min="0" max="5" value="0" placeholder="0-5" required>
                        <small id="count-hint" style="color: #666; font-size: 11px; display: block; margin-top: 2px;">上限: 5人</small>
                    </div>
                </div>
                <button type="submit" class="submit-btn">🚀 送出回報資料</button>
            </form>
        </section>

        <section id="report" class="section-box">
            <h2>🍄 當前最新蘑菇回報</h2>
            <div class="location-select-wrapper">
    <label for="filter-city">📍 選擇縣市：</label>
    <select id="filter-city">
        </select>

    <label for="filter-district">選擇行政區：</label>
    <select id="filter-district">
        </select>

    <div class="sort-group">
        <label for="card-sort">📊 排序方式：</label>
        <select id="card-sort">
            <option value="updateTime">更新時間 (最新)</option>
            <option value="remainingTime">剩餘時間 (最少)</option>
            <option value="totalPlayers">總人數 (最多)</option>
            <option value="mushroomSize">蘑菇大小 (巨型優先)</option>
            <option value="mushroomType">蘑菇種類 (名稱排序)</option>
        </select>
    </div>

    <button id="geo-btn" class="geo-btn">🎯 自動定位</button>
</div>

            <div class="grid-container" id="mushroom-container">
                </div>
        </section>
    </main>

    <div class="dev-toolbar">
        <button id="dev-mode-btn" class="dev-mode-btn">🛠️ 開啟開發者模式</button>
        <span id="dev-status" class="dev-status">🔒 安全瀏覽模式</span>
    </div>

    <footer>
        <p>&copy; 2026 皮克敏蘑菇社群網站. 非官方粉絲製作.</p>
    </footer>

    <script src="report.js"></script>
</body>
</html>
