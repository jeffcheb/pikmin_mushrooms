<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮克敏蘑菇即時回報站</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="style.css?v=999">
</head>
<body>

    <div class="form-section" style="max-width: 600px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h2 style="color: #2e7d32; text-align: center; margin-top: 0;">🍄 回報蘑菇現況</h2>
        <form id="mushroom-form">
            <div style="margin-bottom: 12px;">
                <label>📍 選擇縣市：</label>
                <select id="form-city" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"></select>
            </div>
            <div style="margin-bottom: 12px;">
                <label>選擇行政區：</label>
                <select id="form-district" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"></select>
            </div>
            <div style="margin-bottom: 12px;">
                <label>🏢 地點具體名稱：</label>
                <input type="text" id="form-name" placeholder="例如：公園變電箱、麥當勞旁" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 12px;">
                <label>🍄 蘑菇種類：</label>
                <select id="form-type" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="red">紅色蘑菇</option>
                    <option value="blue">藍色蘑菇</option>
                    <option value="yellow">黃色蘑菇</option>
                    <option value="purple">紫色蘑菇</option>
                    <option value="white">白色蘑菇</option>
                    <option value="rock">灰色蘑菇</option>
                    <option value="wing">粉紅色蘑菇</option>
                    <option value="ice">冰藍蘑菇</option>
                    <option value="rock_crystal">特殊水晶蘑菇</option>
                    <option value="red_fire">元素火蘑菇</option>
                    <option value="blue_water">元素水蘑菇</option>
                    <option value="white_poison">元素毒蘑菇</option>
                    <option value="yellow_electric">元素電子蘑菇</option>
                    <option value="event_special">本月限定活動蘑菇</option>
                </select>
            </div>
            <div style="margin-bottom: 12px;">
                <label>📏 蘑菇大小：</label>
                <select id="form-size" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="小">小</option>
                    <option value="普通" selected>普通</option>
                    <option value="大">大</option>
                    <option value="巨型">巨型</option>
                </select>
            </div>
            <div style="margin-bottom: 12px;">
                <label>👥 目前參戰人數：</label>
                <input type="number" id="form-count" value="0" min="0" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
                <span id="count-hint" style="font-size: 12px; color: #78909c;"></span>
            </div>
            <div style="margin-bottom: 16px;">
                <label>⏳ 剩餘倒數時間：</label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="form-hours" value="0" min="0" placeholder="時" style="width: 33%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; text-align: center;">
                    <input type="number" id="form-minutes" value="0" min="0" max="59" placeholder="分" style="width: 33%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; text-align: center;">
                    <input type="number" id="form-seconds" value="0" min="0" max="59" placeholder="秒" style="width: 33%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; text-align: center;">
                </div>
            </div>
            <button type="submit" style="width: 100%; padding: 10px; background: #2e7d32; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;">🚀 發佈至全台即時看板</button>
        </form>
    </div>

    <div class="filter-section" style="background: #f1f8e9; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 1200px; text-align: center; box-sizing: border-box;">
        
        <div class="filter-group" style="display: inline-block; margin: 5px;">
            <label for="filter-city">📍 選擇縣市：</label>
            <select id="filter-city"></select>
        </div>

        <div class="filter-group" style="display: inline-block; margin: 5px;">
            <label for="filter-district">選擇行政區：</label>
            <select id="filter-district"></select>
        </div>

        <div class="filter-group" style="display: inline-block; margin: 5px;">
            <label for="card-sort">📊 排序方式：</label>
            <select id="card-sort">
                <option value="remainingTime">剩餘時間 (最少)</option>
                <option value="updateTime">更新時間 (最新)</option>
                <option value="totalPlayers">參戰人數 (最多)</option>
                <option value="mushroomSize">蘑菇大小 (最大)</option>
                <option value="mushroomType">蘑菇種類 (名稱)</option>
            </select>
        </div>

        <div class="filter-group" style="display: inline-block; margin: 5px;">
            <input type="text" id="search-name" placeholder="🔍 搜尋關鍵字 (如：電桶)..." 
                   style="padding: 7px 12px; border: 1px solid #ccc; border-radius: 20px; font-size: 14px; width: 190px; outline: none; transition: border 0.2s;">
        </div>

        <div class="filter-group" style="display: inline-block; margin: 5px;">
            <button id="view-toggle-btn" style="padding: 7px 14px; background: #fff; border: 1px solid #ccc; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s;">
                🎴 卡片模式
            </button>
        </div>

        <button id="geo-btn" style="padding: 7px 14px; background: #2e7d32; color: #fff; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; margin: 5px;">🎯 自動定位</button>
    </div>

    <div style="text-align: center; margin: 20px 0;">
        <button id="dev-mode-btn" style="padding: 6px 12px; font-size: 13px; background: #eceff1; border: 1px solid #b0bec5; border-radius: 4px; cursor: pointer;">🛠️ 開啟開發者模式</button>
        <p id="dev-status" style="font-size: 12px; color: #546e7a; margin-top: 5px;">🔒 安全瀏覽模式</p>
    </div>

    <div id="mushroom-container"></div>

    <script src="report.js"></script>
</body>
</html>
