<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮克敏高階工具站 | 蘑菇情報看板</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/report.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="picture/logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/40x40?text=Logo'">
                <h1>皮克敏工具站</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">戰力模擬器</a></li>
                <li><a href="report.html" class="active">蘑菇情報</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-container">
        
        <section class="card report-section">
            <h2>📢 發佈蘑菇情報</h2>
            <form id="report-form" class="report-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">縣市：</label>
                        <select id="city" name="city" required>
                            <option value="" disabled selected>請選擇縣市</option>
                            </select>
                    </div>
                    <div class="form-group">
                        <label for="district">行政區：</label>
                        <select id="district" name="district" required disabled>
                            <option value="" disabled selected>請先選擇縣市</option>
                            </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="location-name">具體地點名稱：</label>
                    <input type="text" id="location-name" name="locationName" placeholder="例：捷運站3號出口" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="mushroom-type">蘑菇種類：</label>
                        <select id="mushroom-type" name="mushroomType" required>
                            <optgroup label="🍄 普通/巨大蘑菇">
                                <option value="一般紅蘑菇">🔴 一般紅蘑菇</option>
                                <option value="一般藍蘑菇">🔵 一般藍蘑菇</option>
                                <option value="一般黃蘑菇">🟡 一般黃蘑菇</option>
                                <option value="一般紫蘑菇">🟣 一般紫蘑菇</option>
                                <option value="一般白蘑菇">⚪ 一般白蘑菇</option>
                                <option value="一般灰蘑菇">🪨 一般灰蘑菇</option>
                                <option value="一般粉紅蘑菇">🪽 一般粉紅蘑菇</option>
                            </optgroup>
                            <optgroup label="⚡ 元素蘑菇">
                                <option value="火蘑菇">🔥 火蘑菇</option>
                                <option value="水蘑菇">💧 水蘑菇</option>
                                <option value="水晶蘑菇">💎 水晶蘑菇</option>
                                <option value="毒蘑菇">☠️ 毒蘑菇</option>
                                <option value="電蘑菇">⚡ 電蘑菇</option>
                            </optgroup>
                            <optgroup label="🌟 當月限定">
                                <option value="每月特殊蘑菇" selected>✨ 每月特殊蘑菇</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="mushroom-size">蘑菇大小：</label>
                        <select id="mushroom-size" name="mushroomSize" required>
                            <option value="小型">小型</option>
                            <option value="普通">普通</option>
                            <option value="大型">大型</option>
                            <option value="巨大">巨大</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="current-players">目前參戰人數：</label>
                        <input type="number" id="current-players" name="currentPlayers" min="0" value="1" required>
                    </div>
                    <div class="form-group time-group">
                        <label>剩餘時間：</label>
                        <div class="time-inputs">
                            <input type="number" id="time-hours" name="timeHours" min="0" max="23" placeholder="時" required>
                            <span>:</span>
                            <input type="number" id="time-minutes" name="timeMinutes" min="0" max="59" placeholder="分" required>
                            <span>:</span>
                            <input type="number" id="time-seconds" name="timeSeconds" min="0" max="59" placeholder="秒" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-primary">發佈情報</button>
            </form>
        </section>

        <hr class="divider">

        <section class="board-section">
            <div class="board-header">
                <h2>🌍 即時蘑菇看板</h2>
                
                <div class="board-controls">
                    <div class="filters">
                        <input type="text" id="search-keyword" placeholder="🔍 搜尋地點或種類...">
                        
                        <select id="filter-city">
                            <option value="all">所有縣市</option>
                        </select>
                        
                        <select id="filter-district" disabled>
                            <option value="all">所有行政區</option>
                        </select>
                        <select id="sort-method">
    <option value="default">📌 預設排序</option>
    <option value="type">🍄 按蘑菇種類</option>
    <option value="size">⚖️ 按蘑菇大小</option>
    <option value="time">⏳ 按剩餘時間</option>
    <option value="update">🕒 按上次更新時間</option>
    <option value="players">👥 按目前總人數</option>
</select>
                        <button id="btn-auto-location" class="btn-sm" type="button" title="自動定位目前區域">🎯 定位</button>
                    </div>
                    <div class="view-toggles">
                        <button id="btn-grid-view" class="active" title="網格模式">🔲</button>
                        <button id="btn-list-view" title="清單模式">📄</button>
                    </div>
                </div>
            </div>

            <div id="mushroom-board" class="board-container grid-view">
                <p class="loading-text">載入即時情報中...</p>
            </div>
        </section>

    </main>

    <script type="module" src="js/firebase-config.js"></script>
    
    <script src="js/taiwan-districts.js"></script> <script src="js/common.js"></script>           <script src="js/report.js"></script>           <script src="js/admin.js"></script>            </body>
</html>
